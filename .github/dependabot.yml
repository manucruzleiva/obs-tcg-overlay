version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # the desktop app (Tauri)
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns:
          - tauri*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
