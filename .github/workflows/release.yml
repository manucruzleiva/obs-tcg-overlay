name: Release

# Push a tag like v1.2.3 (matching "version" in package.json) to build the Windows
# installer and the portable zip of the Tauri app (src-tauri/) and publish them as a
# GitHub Release. Installed copies check the latest release for over-the-air updates:
# latest.json (the Tauri app) and latest.yml (Electron installs, which move to Tauri).
#
# Run it manually from the Actions tab to build without publishing: the files are
# uploaded as a workflow artifact instead.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm test
      # the control panel and settings in a real browser (Windows runners ship with Edge)
      - run: npm run test:ui

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      # the server and this runner's node.exe go into src-tauri/ (the app runs them as its sidecar)
      - run: npm run tauri:stage
      - run: rustup default stable

      # Over-the-air updates need the updater key: the secret TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD), and its public half in
      # src-tauri/tauri.updater.conf.json (see docs/DEVELOPING.md). Without them the build works and the app does not update itself.
      - name: Build the Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pubkey="$(node -p "require('./src-tauri/tauri.updater.conf.json').plugins.updater.pubkey")"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$pubkey" ]; then
            npx --yes @tauri-apps/cli@2.12.6 build --config src-tauri/tauri.updater.conf.json
          else
            echo "::warning::No updater key: this build will not update itself"
            npx --yes @tauri-apps/cli@2.12.6 build
          fi

      - run: node scripts/tauri-release-files.js

      - name: Say whether the files are signed
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem dist/*.exe) {
            $signature = Get-AuthenticodeSignature $file
            Write-Host ("{0}: {1}" -f $file.Name, $signature.Status)
            if ($env:REQUIRE_SIGNING -eq 'true' -and $signature.Status -ne 'Valid') { throw "$($file.Name) is not signed" }
          }
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}

      - name: Check the release files exist
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml
          ls dist/OTO-Setup-*.exe
          ls dist/OTO-*-portable.zip
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then test -f dist/latest.json; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
            dist/latest.json
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
            dist/latest.json
          generate_release_notes: true
          # Pre-release tags (v1.2.0-beta.1) are not offered to installed apps as updates
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
