<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTO Overlay</title>
  <link rel="icon" type="image/x-icon" href="/logo.ico">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/overlay.css">
</head>
<body>
  <!-- The overlay is drawn on a 1920x1080 stage that is scaled to fit the browser source. Its frame clips what is drawn to the box of
       the stage, so the page around it stays see-through for OBS: a design's style sheet can only style #stage and what is in it. -->
  <div id="stage-frame"><div id="stage"></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/display-options.js"></script>
  <script src="/js/game-data.js"></script>
  <script src="/js/pokedex.js"></script>
  <script src="/js/deck-popular.js"></script>
  <script src="/js/deck.js"></script>
  <script src="/js/countries.js"></script>
  <script src="/js/theme-options.js"></script>
  <script src="/js/sfx.js"></script>
  <script src="/js/overlay.js"></script>
</body>
</html>
