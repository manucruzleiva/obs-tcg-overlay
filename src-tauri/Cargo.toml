[package]
name = "oto"
version = "0.0.0" # the app version comes from ../package.json (tauri.conf.json)
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
base64 = "0.23"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[features]
# a single OTO.exe that carries Node and the server (OTO_PAYLOAD: the zip to embed, made by scripts/tauri-release-files.js)
portable = ["dep:zip"]

[profile.release]
lto = true
strip = true
