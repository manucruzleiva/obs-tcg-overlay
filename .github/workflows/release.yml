name: Release

# Push a tag like v1.2.3 (matching "version" in package.json) to build the Windows
# installer and portable .exe and publish them as a GitHub Release. The installer
# build checks this release (latest.yml) for over-the-air updates.
#
# Run it manually from the Actions tab to build without publishing: the files are
# uploaded as a workflow artifact instead.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      # the control panel and settings in a real browser (Windows runners ship with Edge)
      - run: npm run test:ui

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      # Builds the NSIS installer (self-updating) and the portable exe, plus latest.yml.
      # Code signing: when the repository has the two secrets below, the .exe files are signed; without them they are built unsigned, as always
      # (see docs/SIGNING.md). WIN_CSC_LINK is the certificate (a .pfx, as a link or as base64 text) and WIN_CSC_KEY_PASSWORD its password.
      - run: npm run dist
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Say whether the files are signed
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem dist/*.exe) {
            $signature = Get-AuthenticodeSignature $file
            Write-Host ("{0}: {1}" -f $file.Name, $signature.Status)
            if ($env:REQUIRE_SIGNING -eq 'true' -and $signature.Status -ne 'Valid') { throw "$($file.Name) is not signed" }
          }
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}

      - name: Check the release files exist
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml
          ls dist/OTO-Setup-*.exe
          ls dist/OTO-*-portable.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          generate_release_notes: true
          # Pre-release tags (v1.2.0-beta.1) are not offered to installed apps as updates
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
