<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Control panel password</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 22px 24px; background: #0f1420; color: #f3f6fc; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 0 0 14px; color: #aab5cb; }
    label { display: block; margin: 0 0 12px; font-size: 12px; color: #aab5cb; }
    input { display: block; width: 100%; margin-top: 4px; padding: 9px 11px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.18); background: #1a2233; color: #f3f6fc; font-size: 15px; }
    input:focus { outline: 2px solid #7c8cff; outline-offset: 1px; }
    .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    button { padding: 8px 18px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: transparent; color: inherit; font-size: 14px; cursor: pointer; }
    button.primary { background: #7c8cff; border-color: transparent; color: #0a0d14; font-weight: 700; }
    #error { min-height: 20px; margin: 0; color: #f87171; font-size: 13px; }
  </style>
</head>
<body>
  <h1 id="title">Control panel password</h1>
  <p>Anyone who opens the control panel, on this computer or from another device, has to type it. It can be any text. The overlay never asks for it.</p>
  <form id="form" autocomplete="off">
    <label>Password<input id="password" type="password" maxlength="128" autofocus aria-label="Password"></label>
    <label>The same password again<input id="repeat" type="password" maxlength="128" aria-label="The same password again"></label>
    <p id="error" role="alert"></p>
    <div class="row">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="save">Save the password</button>
    </div>
  </form>
  <script>
    const password = document.getElementById('password');
    const repeat = document.getElementById('repeat');
    const error = document.getElementById('error');
    document.getElementById('cancel').addEventListener('click', () => window.passwordApi.cancel());
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') window.passwordApi.cancel(); });
    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      if (!password.value) { error.textContent = 'Write the password, or leave the window to keep things as they are.'; password.focus(); return; }
      if (password.value !== repeat.value) { error.textContent = 'The two passwords are not the same.'; repeat.focus(); return; }
      const result = await window.passwordApi.save(password.value);
      if (!result.ok) error.textContent = result.error;
    });
  </script>
</body>
</html>
