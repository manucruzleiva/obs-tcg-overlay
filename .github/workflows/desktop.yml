name: Desktop build

# Builds the desktop app (src-tauri/) on a pull request that touches it, as the release does, without the updater key.
# Nothing is published: the installer, the portable zip and the update feeds are uploaded as a workflow artifact.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/stage-tauri.js'
      - 'scripts/tauri-release-files.js'
      - 'package.json'
      - 'package-lock.json'
      - 'src/server.js'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # the server and this runner's node.exe go into src-tauri/ (the app runs them as its sidecar)
      - run: npm run tauri:stage
      - run: rustup default stable
      - run: npx --yes @tauri-apps/cli@2.12.6 build
      - run: node scripts/tauri-release-files.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oto-windows
          path: dist/
          if-no-files-found: error
